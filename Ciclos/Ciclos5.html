<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 5: break</title>
</head>
<body>
    <script type="text/javascript">
        var x = 1;
        document.write("Entering the loop<br />");

        while (x < 20) {
            if (x == 5) {
                break; // Sale completamente del ciclo.
            }
            x = x + 1;
            document.write(x + "<br />");
        }

        document.write("Exiting the loop!<br />");
    </script>
</body>
</html>
