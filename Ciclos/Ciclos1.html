<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 1: while</title>
</head>
<body>
    <script type="text/javascript">
        var count = 0;
        document.write("Starting Loop<br />");

        while (count < 10) {
            document.write("Current Count : " + count + "<br />");
            count++;
        }

        document.write("Loop stopped!");
    </script>
</body>
</html>
