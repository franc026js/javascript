<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 4: for...in</title>
</head>
<body>
    <script type="text/javascript">
        var aProperty;

        document.write("Navigator Object Properties<br />");
        for (aProperty in navigator) {
            document.write(aProperty);
            document.write("<br />");
        }
        document.write("Exiting from the loop!");
    </script>
    <p>Las propiedades que aparecen pueden variar según el navegador.</p>
</body>
</html>
