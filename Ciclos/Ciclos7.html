<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 7: etiquetas y break</title>
</head>
<body>
    <script type="text/javascript">
        document.write("Entering the loop!<br />");

        outerloop: // Este nombre identifica el ciclo externo.
        for (var i = 0; i < 5; i++) {
            document.write("Outerloop: " + i + "<br />");
            innerloop:
            for (var j = 0; j < 5; j++) {
                if (j > 3) {
                    break;
                }
                if (i == 2) {
                    break innerloop;
                }
                if (i == 4) {
                    break outerloop;
                }
                document.write("Innerloop: " + j + "  <br />");
            }
        }

        document.write("Exiting the loop!<br />");
    </script>
</body>
</html>
