<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 6: continue</title>
</head>
<body>
    <script type="text/javascript">
        var x = 1;
        document.write("Entering the loop<br />");

        while (x < 10) {
            x = x + 1;
            if (x == 5) {
                // continue salta el resto de esta vuelta y pasa a la siguiente iteración.
                continue;
            }
            document.write(x + "<br />");
        }

        document.write("Exiting the loop!<br />");
    </script>
</body>
</html>
