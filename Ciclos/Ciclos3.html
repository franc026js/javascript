<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 3: for</title>
</head>
<body>
    <script type="text/javascript">
        var count;
        document.write("Starting Loop<br />");

        for (count = 0; count < 10; count++) {
            document.write("Current Count : " + count);
            document.write("<br />");
        }

        document.write("Loop stopped!");
    </script>
</body>
</html>
