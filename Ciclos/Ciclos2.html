<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ciclos 2: do...while</title>
</head>
<body>
    <script type="text/javascript">
        var count = 0;
        document.write("Starting Loop<br />");

        do {
            document.write("Current Count : " + count + "<br />");
            count++;
        } while (count < 5);

        document.write("Loop stopped!");
    </script>
</body>
</html>
