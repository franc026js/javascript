<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Operaciones matemáticas</title>
</head>
<body>
    <script type="text/javascript">
        var a = 33;
        var b = 10;
        var c = "Test";
        var linebreak = "<br />";
        var result;

        document.write("a + b = ");
        result = a + b; // Suma los valores de a y b.
        document.write(result);
        document.write(linebreak);

        document.write("a - b = ");
        result = a - b; // Resta b a a.
        document.write(result);
        document.write(linebreak);

        document.write("a / b = ");
        result = a / b; // Divide a por b.
        document.write(result);
        document.write(linebreak);

        document.write("a % b = ");
        result = a % b; // Muestra el resto de dividir a por b.
        document.write(result);
        document.write(linebreak);

        document.write("a + b + c = ");
        result = a + b + c; // Suma los números y concatena el texto.
        document.write(result);
        document.write(linebreak);

        a = a++; // El postincremento se reasigna con su valor anterior.
        document.write("a++ = ");
        result = a++; // Devuelve a antes de incrementarla.
        document.write(result);
        document.write(linebreak);

        b = b--; // El postdecremento se reasigna con su valor anterior.
        document.write("b-- = ");
        result = b--; // Devuelve b antes de disminuirla.
        document.write(result);
        document.write(linebreak);
    </script>
    <p>Set the variables to different values and then try...</p>
</body>
</html>
