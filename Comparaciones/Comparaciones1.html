<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparaciones</title>
</head>
<body>
    <script type="text/javascript">
        var a = 10;
        var b = 20;
        var linebreak = "<br />";
        var result;

        document.write("(a == b) => ");
        result = (a == b); // Comprueba si a y b tienen el mismo valor.
        document.write(result);
        document.write(linebreak);

        document.write("(a < b) => ");
        result = (a < b); // Comprueba si a es menor que b.
        document.write(result);
        document.write(linebreak);

        document.write("(a > b) => ");
        result = (a > b); // Comprueba si a es mayor que b.
        document.write(result);
        document.write(linebreak);

        document.write("(a != b) => ");
        result = (a != b); // Comprueba si a y b tienen valores distintos.
        document.write(result);
        document.write(linebreak);

        document.write("(a >= b) => ");
        result = (a >= b); // Comprueba si a es mayor o igual que b.
        document.write(result);
        document.write(linebreak);

        document.write("(a <= b) => ");
        result = (a <= b); // Comprueba si a es menor o igual que b.
        document.write(result);
    </script>
</body>
</html>
